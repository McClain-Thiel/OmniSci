[project]
name = "omnisci"
version = "0.1.0"
description = "Local-first scientific workbench — science project layer (spec: OMNIGENT_SCIENCE_DEVELOPMENT_SPEC)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=1.2",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
s3 = [
    "boto3>=1.28",
]
modal = [
    "modal>=1.4,<2",
]

[project.scripts]
science = "omnisci.cli.main:main"
science-mcp = "omnisci.mcp_server:main"

[project.entry-points."omnigent_science.compute"]
local = "omnisci.compute.local:LocalComputeProvider"
modal = "omnisci.compute.modal:ModalComputeProvider"
qsub = "omnisci.compute.scheduler:QsubComputeProvider"
slurm = "omnisci.compute.scheduler:SlurmComputeProvider"
ssh = "omnisci.compute.ssh:SshComputeProvider"

[project.entry-points."omnigent_science.storage"]
s3 = "omnisci.storage.s3:S3StorageProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omnisci"]

[tool.pytest.ini_options]
testpaths = ["tests"]
